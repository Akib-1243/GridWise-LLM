services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_database:/var/www/html/database
      - backend_storage:/var/www/html/storage
    environment:
      APP_ENV: local
      APP_KEY: base64:sDGfJEPNvEVmCC0dOUxowL3Fxqkc/I49YjrfPE2JX54=
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: array
      CACHE_STORE: array
      ADMIN_EMAIL: admin@example.com
      ADMIN_NAME: admin
      ADMIN_PASSWORD: password
    command: sh -c "composer dump-autoload --no-interaction && php artisan optimize:clear && mkdir -p database storage/framework/cache storage/framework/sessions storage/framework/views && touch database/database.sqlite && php artisan migrate --force && php artisan db:seed --class=Database\\\\Seeders\\\\DatabaseSeeder --force && chown -R www-data:www-data database storage && php-fpm"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - nginx

volumes:
  backend_vendor:
  backend_database:
  backend_storage:
