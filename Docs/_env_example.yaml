services:
  app:
    build: ./docker/php
    volumes: [".:/var/www/html"]
    depends_on: [mysql]
    environment:
      - APP_ENV=local
      - DB_HOST=mysql
    ports: ["9000:9000"]

  nginx:
    image: nginx:alpine
    volumes:
      - ".:/var/www/html"
      - "./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf"
    ports: ["8000:80"]
    depends_on: [app]

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: gridwise
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes: ["db_data:/var/lib/mysql"]
    ports: ["3306:3306"]

  queue:
    build: ./docker/php
    command: php artisan queue:work
    depends_on: [mysql]

volumes:
  db_data: